server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend container, mirroring the Vite dev
    # proxy in vite.config.js so the frontend never needs to know the
    # backend's real address.
    location /backend-api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: let the app handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
